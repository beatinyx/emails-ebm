<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>slices</title>
<!-- Fatias visuais dos e-mails VSM Black EBM. Renderizadas a 2x pelo build.mjs.
     Cada slice é um #slice; a variante vem da query string (?s=hero&img=...). -->
<style>
  :root{
    --bg:#1E0A04;
    --orange:#F7901E;
    --yellow:#FFC20E;
    --red:#E8231B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{width:600px;font-family:'Gotham','Montserrat',Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  .slice{position:relative;width:600px;overflow:hidden;background:var(--bg)}
  .slice[hidden]{display:none}
  img{display:block}

  /* ---------- HEADER ---------- */
  #header{height:300px;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(242,106,16,.95) 0%, rgba(190,62,8,.9) 32%, rgba(98,30,6,.85) 62%, rgba(30,10,4,1) 92%),
      var(--bg);}
  #header .grain{position:absolute;inset:0;background:url(assets/fundo-gradiente.jpg) center top/cover;mix-blend-mode:soft-light;opacity:.55}
  #header .faixa{position:absolute;width:760px;left:-80px;top:-62px;transform:rotate(-1deg);filter:blur(.6px)}
  #header .fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom,rgba(30,10,4,0),var(--bg))}
  #header .selo{position:absolute;width:350px;left:50%;top:62px;transform:translateX(-50%);filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}

  /* ---------- HERO (foto do produto) ---------- */
  #hero{padding:28px 24px 50px}
  #hero .faixa{position:absolute;width:820px;left:-110px;bottom:22px;transform:rotate(-4deg);opacity:.95;filter:blur(1.2px)}
  #hero .card{position:relative;z-index:2}
  #hero .tab{height:58px;border-radius:20px 20px 0 0;
    background:linear-gradient(180deg,#8a2f0b 0%,#6a2208 100%);
    box-shadow:inset 0 1px 0 rgba(255,170,90,.35);
    display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:6px}
  #hero .tab img{height:24px}
  #hero .tab span{font-weight:400;font-size:22px;letter-spacing:6px}
  #hero .tab2{height:14px;margin:-8px 0 0;border-radius:16px 16px 0 0;background:linear-gradient(180deg,#a8400e,#7b2909);box-shadow:inset 0 1px 0 rgba(255,190,120,.35)}
  #hero .photo{position:relative;height:330px;border-radius:0 0 18px 18px;overflow:hidden;margin-top:-2px;
    box-shadow:0 18px 40px rgba(0,0,0,.55)}
  #hero .photo img{width:100%;height:100%;object-fit:cover}
  #hero .pronto{position:absolute;z-index:3;width:236px;left:50%;transform:translateX(-50%);top:86px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  #hero .label{position:absolute;right:14px;bottom:14px;background:var(--red);color:#fff;font-size:10px;font-weight:500;letter-spacing:.5px;padding:4px 10px 3px;border-radius:999px}

  /* ---------- OFERTA ---------- */
  #oferta{padding:34px 24px 34px}
  #oferta .row{display:flex;align-items:center;justify-content:center;gap:0}
  .neon{position:relative;width:250px;height:128px;border-radius:20px;
    background:
      linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 28%),
      linear-gradient(160deg,#5c1607 0%,#2a0904 55%,#521405 100%);
    border:2px solid #FFB25A;
    box-shadow:
      0 0 0 2px rgba(255,120,20,.55),
      0 0 18px 4px rgba(255,110,10,.75),
      0 0 46px 8px rgba(255,80,0,.38),
      inset 0 0 18px rgba(255,110,20,.55),
      inset 0 0 2px rgba(255,220,160,.9);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .neon .lbl{font-size:15px;font-weight:500;letter-spacing:.2px;line-height:1.25;color:#fff;text-transform:uppercase}
  .neon .val{font-weight:700;color:var(--yellow);line-height:1;text-transform:uppercase;margin-top:6px;white-space:nowrap}
  .neon .val small{font-size:22px;vertical-align:top;position:relative;top:7px;margin-right:2px}
  .neon .val sup{font-size:18px;vertical-align:top;position:relative;top:-2px;color:#fff;margin-left:2px}
  .plus{width:46px;height:46px;margin:0 -6px;z-index:2;border-radius:50%;background:var(--yellow);color:#2a0904;
    font-weight:900;font-size:34px;line-height:46px;text-align:center;box-shadow:0 0 0 4px var(--bg),0 0 18px rgba(255,190,20,.6)}
  .tag{position:relative;margin:34px auto 0;width:max-content;transform:rotate(-2deg)}
  .tag .body{position:relative;background:var(--yellow);color:#2a0904;font-weight:700;font-size:24px;letter-spacing:.3px;
    padding:15px 30px 13px 54px;border-radius:6px 12px 12px 6px;text-transform:uppercase;box-shadow:0 8px 22px rgba(0,0,0,.45),0 0 26px rgba(255,190,20,.35)}
  .tag .body::before{content:"";position:absolute;left:-22px;top:0;border-style:solid;border-width:29px 22px 29px 0;border-color:transparent var(--yellow) transparent transparent}
  .tag .hole{position:absolute;left:14px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px rgba(42,9,4,.35)}
  .tag sup{font-size:16px;vertical-align:top;position:relative;top:-2px}

  /* ---------- PRAZO (e-mail 3) ---------- */
  #prazo{height:140px;display:flex;align-items:center;justify-content:center}
  #prazo .stripes{position:absolute;left:-40px;right:-40px;top:44px;height:52px;transform:rotate(-2deg);
    background:repeating-linear-gradient(-55deg,#111 0 22px,var(--orange) 22px 44px);filter:blur(.5px);opacity:.95}
  #prazo .box{position:relative;z-index:2;background:#140603;border:2px solid #FF5A3C;border-radius:14px;padding:14px 30px 12px;
    box-shadow:0 0 14px 2px rgba(255,60,30,.75),0 0 40px rgba(255,60,30,.35),inset 0 0 12px rgba(255,60,30,.45)}
  #prazo .box span{display:block;font-weight:700;font-size:30px;letter-spacing:.5px;color:var(--yellow);text-transform:uppercase;white-space:nowrap}

  /* ---------- RODAPÉ ---------- */
  #footer{padding:30px 24px 26px;text-align:center}
  #footer .faixa{position:absolute;width:760px;left:-80px;top:12px;opacity:.9;filter:blur(1px);transform:rotate(1deg)}
  #footer .assin{width:460px;margin:66px auto 0}
  #footer .logos{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:30px}
  #footer .vsm{width:220px;margin:-34px -30px}
  #footer .sep{width:1px;height:58px;background:rgba(255,255,255,.35)}
  #footer .ebm{width:118px}
</style>
</head>
<body>

<section id="header" class="slice" hidden>
  <div class="grain"></div>
  <img class="faixa" src="assets/faixa-interdicao-topo.png" alt="">
  <div class="fade"></div>
  <img class="selo" src="assets/selo-black-ebm.png" alt="">
</section>

<section id="hero" class="slice" hidden>
  <img class="faixa" src="assets/faixa-interdicao.png" alt="">
  <div class="card">
    <div class="tab"><img src="assets/icone-pin.png" alt=""><span>SAMAMBAIA</span></div>
    <div class="tab2"></div>
    <div class="photo"><img id="heroImg" src="" alt=""><div class="label" id="heroLabel"></div></div>
  </div>
  <img class="pronto" src="assets/selo-pronto-para-morar.png" alt="">
</section>

<section id="oferta" class="slice" hidden>
  <div class="row">
    <div class="neon">
      <div class="lbl">Até</div>
      <div class="val" style="font-size:60px"><small>R$</small>5 MIL</div>
    </div>
    <div class="plus">+</div>
    <div class="neon">
      <div class="lbl">3 meses de<br>condomínio</div>
      <div class="val" style="font-size:46px">Grátis<sup>*</sup></div>
    </div>
  </div>
  <div class="tag"><div class="body"><span class="hole"></span>ITBI e registro grátis<sup>*</sup></div></div>
</section>

<section id="prazo" class="slice" hidden>
  <div class="stripes"></div>
  <div class="box"><span>Aproveite até 30/11</span></div>
</section>

<section id="footer" class="slice" hidden>
  <img class="faixa" src="assets/faixa-interdicao-base.png" alt="">
  <img class="assin" src="assets/aqui-sua-compra-e-pra-vida-toda.png" alt="">
  <div class="logos">
    <img class="vsm" src="assets/logo-vsm-negativo.png" alt="">
    <div class="sep"></div>
    <img class="ebm" src="assets/logo-ebm-branca.png" alt="">
  </div>
</section>

<script>
  const q = new URLSearchParams(location.search);
  const el = document.getElementById(q.get('s') || 'header');
  el.hidden = false;
  if (q.get('img')) {
    document.getElementById('heroImg').src = 'assets/' + q.get('img');
    document.getElementById('heroImg').style.objectPosition = q.get('pos') || 'center';
    const lbl = document.getElementById('heroLabel');
    lbl.textContent = q.get('label') || '';
    lbl.style.display = q.get('label') ? '' : 'none';
  }
</script>
</body>
</html>
